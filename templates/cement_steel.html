<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cement, TMT &amp; Structural Steel - Sharma Hardware</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Inter,sans-serif;background:#f8fafc;color:#1e293b}
        header{background:#1b4d2e;color:white;padding:0.9rem 2rem;display:flex;justify-content:space-between;align-items:center}
        .logo{color:white;text-decoration:none;font-weight:700}
        .container{max-width:1200px;margin:0 auto;padding:2rem}
        .page-header{margin-bottom:2rem}
        .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
        .product-card{background:white;border-radius:12px;box-shadow:0 10px 30px rgba(15,23,42,0.06);overflow:hidden}
        .product-media{height:200px;background:url('images/prod_1.jpg');background-size:cover}
        .product-body{padding:1rem}
        .name{font-weight:600;margin-bottom:0.4rem}
        .price{color:#1b4d2e;font-weight:700;margin-bottom:0.6rem}
        .btn{display:inline-block;padding:0.6rem 1rem;border-radius:999px;text-decoration:none;background:#1b4d2e;color:white;font-size:0.9rem}
        .back{display:inline-block;margin:1rem 0;color:#1b4d2e;text-decoration:none}
    </style>
</head>
<body>
    <header><a class="logo" href="sharma_premium.html"><i class="fas fa-tools"></i> Sharma Hardware</a></header>
    <main class="container">
        <a class="back" href="sharma_premium.html"><i class="fas fa-arrow-left"></i> Back</a>
        <div class="page-header">
            <h1>Cement, TMT &amp; Structural Steel</h1>
            <p>OPC Cement, PPC Cement, TMT Bars, MS Angles, Channels &amp; more</p>
        </div>
        <div class="products">
            <div class="product-card">
                <div class="product-media"></div>
                <div class="product-body">
                    <div class="name">Ultratech OPC 43 Grade</div>
                    <div class="price">&#8377; 390 / 50kg Bag</div>
                    <a class="btn" href="sharma_product_detail.html">View Details</a>
                </div>
            </div>
            <div class="product-card">
                <div class="product-media" style="background:url('images/prod_2.jpg');background-size:cover"></div>
                <div class="product-body">
                    <div class="name">Fe 500D TMT Bars</div>
                    <div class="price">&#8377; 74 - 82 / Kg</div>
                    <a class="btn" href="sharma_product_detail.html">View Details</a>
                </div>
            </div>
            <div class="product-card">
                <div class="product-media"></div>
                <div class="product-body">
                    <div class="name">MS Angle</div>
                    <div class="price">&#8377; 62 - 95 / Kg</div>
                    <a class="btn" href="sharma_product_detail.html">View Details</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
