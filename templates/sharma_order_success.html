<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed - Sharma Hardware</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Inter,sans-serif;background:#f8fafc;color:#1e293b}
        .success-card{max-width:520px;margin:4rem auto;background:white;border-radius:16px;box-shadow:0 20px 50px rgba(15,23,42,0.1);text-align:center;padding:3rem 2rem}
        .check-circle{width:80px;height:80px;border-radius:50%;background:#dcfce7;color:#16a34a;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 1.4rem}
        h1{font-size:1.8rem;margin-bottom:0.6rem}
        p{margin-bottom:1.8rem;opacity:0.8}
        .btn{display:inline-block;padding:0.9rem 2rem;border-radius:999px;text-decoration:none;background:#1b4d2e;color:white;font-weight:600}
    </style>
</head>
<body>
    <main class="success-card">
        <div class="check-circle"><i class="fas fa-check"></i></div>
        <h1>Order Placed Successfully!</h1>
        <p>Thank you for shopping with Sharma Hardware. We'll contact you shortly to confirm your order.</p>
        <a class="btn" href="sharma_pro.html"><i class="fas fa-home"></i> Back to Home</a>
    </main>
</body>
</html>
