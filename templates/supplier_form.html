{% extends "base.html" %}
{% set active_page = "suppliers" %}

{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block breadcrumb %}Business / Suppliers / {{ title }}{% endblock %}

{% block content %}
<div style="max-width: 700px;">
    <div class="card">
        <div class="card-header">
            <h3><i class="fas fa-building"></i> {{ title }}</h3>
        </div>
        <div class="card-body">
            <form method="POST" action="/suppliers/{% if supplier %}edit/{{ supplier.id }}{% else %}add{% endif %}" id="supplier-form">
                <div class="form-group">
                    <label class="form-label">Company Name *</label>
                    <input type="text" name="name" class="form-control" required
                           value="{{ supplier.name if supplier else '' }}" placeholder="e.g., Bosch India Ltd." id="supplier-name">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Contact Person</label>
                        <input type="text" name="contact_person" class="form-control"
                               value="{{ supplier.contact_person if supplier else '' }}" placeholder="Contact name" id="supplier-contact">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control"
                               value="{{ supplier.email if supplier else '' }}" placeholder="email@example.com" id="supplier-email">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Phone</label>
                        <input type="text" name="phone" class="form-control"
                               value="{{ supplier.phone if supplier else '' }}" placeholder="+91-9876543210" id="supplier-phone">
                    </div>
                    <div class="form-group">
                        <label class="form-label">City</label>
                        <input type="text" name="city" class="form-control"
                               value="{{ supplier.city if supplier else '' }}" placeholder="City" id="supplier-city">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Address</label>
                    <textarea name="address" class="form-control" placeholder="Full address" id="supplier-address">{{ supplier.address if supplier else '' }}</textarea>
                </div>

                <div class="d-flex gap-1 mt-2">
                    <button type="submit" class="btn btn-primary" id="supplier-submit">
                        <i class="fas fa-save"></i> {{ 'Update' if supplier else 'Add' }} Supplier
                    </button>
                    <a href="/suppliers" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
